<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7C3AED" />
    <title>DriveMate — Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; background: #F5F3FF; color: #0B1E3F; }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px; display: block; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #5A6478; line-height: 1.5; margin: 0 0 20px; }
      button { border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
        background: linear-gradient(90deg, #7C3AED, #DB2777); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>DriveMate needs an internet connection to show cars, prices and your trips. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
